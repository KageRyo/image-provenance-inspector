[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "image-provenance-inspector"
version = "0.2.0"
description = "Inspect image provenance and create privacy-sanitized copies without removing provenance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Image Provenance Inspector contributors" }]
keywords = ["c2pa", "content-credentials", "image-metadata", "provenance", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=10.4,<12",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
analysis = [
  "imagehash>=4.3,<5",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "scikit-image>=0.24,<1",
]
c2pa = [
  "c2pa-python>=0.19,<1",
]
ui = [
  "streamlit>=1.39,<2",
]

[project.urls]
Homepage = "https://github.com/KageRyo/image-provenance-inspector"
Repository = "https://github.com/KageRyo/image-provenance-inspector"
Issues = "https://github.com/KageRyo/image-provenance-inspector/issues"

[project.scripts]
image-provenance-inspector = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
